<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SpotPulse Pro V4</title><style>html,body,iframe{margin:0;width:100%;height:100%;border:0;background:#07111f}html,body{height:100%}</style></head><body><iframe id="app" src="index.html?v=4"></iframe><script>
const app=document.getElementById('app');
app.addEventListener('load',()=>{const d=app.contentDocument;const s=d.createElement('script');s.textContent='\n(() => {\n  const css=document.createElement(\'style\');\n  css.textContent=`.pill.BUYNOW{background:rgba(34,201,138,.18);border:1px solid rgba(34,201,138,.42);color:#9ff8d1}\n  .pill.WAITPULLBACK,.pill.WAITBREAKOUT,.pill.WAITCOOL,.pill.NOCHASE{background:rgba(244,189,85,.12);border:1px solid rgba(244,189,85,.28);color:#ffe0a2}\n  .sig.BUYNOW{color:var(--green)}.sig.WAITPULLBACK,.sig.WAITBREAKOUT,.sig.WAITCOOL,.sig.NOCHASE{color:var(--amber)}`;\n  document.head.appendChild(css);\n\n  document.querySelector(\'.sub\').textContent=\'Binance Spot universe • setup quality + execution timing • no-chase logic • risk-aware entries\';\n  document.querySelector(\'.notice\').innerHTML=\'<b>Pro execution rule:</b> Setup quality aur trade timing alag hain. Score 100 bhi ho sakta hai lekin agar price overextended ho, 15m RSI garam ho, ya valid entry trigger na aya ho to dashboard <b>WAIT / NO CHASE</b> kahega. Sirf <b>BUY NOW</b> ko immediate-entry candidate samjho. Score win-rate nahi hai. Spot only: EXIT = cash.\';\n  const sf=document.getElementById(\'sigFilter\');\n  sf.parentElement.firstChild.textContent=\'Action filter \';\n  sf.innerHTML=\'<option value="ALL">All</option><option value="BUYNOW">BUY NOW</option><option value="WAIT">WAIT / NO CHASE</option><option value="EXIT">EXIT</option>\';\n  const k=document.querySelectorAll(\'.kpi\');\n  k[2].querySelector(\'.k\').textContent=\'BUY NOW\'; k[2].querySelector(\'.s\').textContent=\'Execution conditions active now\';\n  k[3].querySelector(\'.k\').textContent=\'Wait / No-chase\'; k[3].querySelector(\'.s\').textContent=\'Good setup, timing not ready\';\n  document.querySelector(\'thead tr\').innerHTML=\'<th>Pair</th><th>Action now</th><th>Setup</th><th>Score</th><th>Risk</th><th>Price</th><th>24h</th><th>24h Vol</th><th>15m RSI</th><th>1H</th><th>4H</th><th>1H RSI</th><th>Rel Vol</th>\';\n\n  const oldTfStats=tfStats;\n  tfStats=function(k){\n    const x=oldTfStats(k);\n    x.prevHigh20=Math.max(...k.slice(-21,-1).map(z=>+z[2]));\n    return x;\n  };\n  makePlan=function(s1,signal){\n    if(![\'STRONGBUY\',\'BUY\'].includes(signal)||!s1.atr)return null;\n    const a=s1.atr;\n    const pullbackLow=s1.ema20-.15*a, pullbackHigh=s1.ema20+.25*a;\n    const breakout=Math.max(s1.prevHigh20||s1.high20,s1.ema20+.65*a)+.08*a;\n    const noChase=Math.max(breakout+.65*a,s1.ema20+1.8*a);\n    const entryRef=(pullbackLow+pullbackHigh)/2;\n    let stop=Math.min(s1.low12-.12*a,s1.ema50-.35*a,entryRef-1.6*a);\n    stop=Math.max(stop,entryRef-3*a);\n    const R=entryRef-stop;if(R<=0)return null;\n    return{pullbackLow,pullbackHigh,breakout,noChase,stop,tp1:entryRef+R,tp2:entryRef+1.5*R,tp3:entryRef+2*R,R};\n  };\n  window.executionDecision=function(s15,s1,s4,q,plan){\n    if(q.signal===\'EXIT\')return{action:\'EXIT\',cls:\'EXIT\',reason:\'Structure weak/bearish. Spot stance = cash.\'};\n    if(!plan||![\'STRONGBUY\',\'BUY\'].includes(q.signal))return{action:\'WAIT\',cls:\'WATCH\',reason:\'Setup confirmation incomplete.\'};\n    if(marketRegimeText()===\'RISKOFF\')return{action:\'WAIT RISK-OFF\',cls:\'WAITCOOL\',reason:\'BTC market regime risk-off hai.\'};\n    const p=s1.price;\n    if(s15.rsi>=72||s1.rsi>72)return{action:\'WAIT COOL-OFF\',cls:\'WAITCOOL\',reason:`Momentum overextended: 15m RSI ${fmt(s15.rsi,1)}, 1H RSI ${fmt(s1.rsi,1)}.`};\n    if(p>=plan.noChase)return{action:\'NO CHASE\',cls:\'NOCHASE\',reason:\'Price planned value zone se bohat extend ho chuki hai.\'};\n    const inPullback=p>=plan.pullbackLow&&p<=plan.pullbackHigh;\n    if(inPullback&&s15.rsi>=45&&s15.rsi<=68&&s15.trend!==\'BEAR\'&&s1.relVol>=.7)\n      return{action:\'BUY NOW\',cls:\'BUYNOW\',reason:\'Price value zone mein hai aur short-term momentum controlled hai.\'};\n    if(p>=plan.breakout&&s1.relVol>=1.2&&s1.taker>=.53&&s15.rsi<72)\n      return{action:\'BUY NOW\',cls:\'BUYNOW\',reason:\'Breakout volume + taker participation ke sath confirm hua.\'};\n    if(p<plan.pullbackLow)return{action:\'WAIT RECLAIM\',cls:\'WAITBREAKOUT\',reason:`Price value zone se neeche hai. ${money(plan.pullbackLow)} reclaim ka wait.`};\n    if(p>plan.pullbackHigh&&p<plan.breakout)return{action:\'WAIT BREAKOUT\',cls:\'WAITBREAKOUT\',reason:`${money(plan.breakout)} breakout ya pullback ka wait.`};\n    if(p>plan.breakout&&s1.relVol<1.2)return{action:\'NO CHASE\',cls:\'NOCHASE\',reason:\'Breakout price aya lekin volume confirmation weak hai.\'};\n    return{action:\'WAIT PULLBACK\',cls:\'WAITPULLBACK\',reason:`Better entry ${money(plan.pullbackLow)}–${money(plan.pullbackHigh)} ya confirmed breakout ${money(plan.breakout)}.`};\n  };\n  analyze=async function(symbol){\n    const row=baseRow(symbol),[k15,k1,k4]=await Promise.all([klines(symbol,\'15m\',180),klines(symbol,\'1h\',240),klines(symbol,\'4h\',240)]);\n    const s15=tfStats(k15),s1=tfStats(k1),s4=tfStats(k4),q=scoreSetup(row,s1,s4),plan=makePlan(s1,q.signal),exec=executionDecision(s15,s1,s4,q,plan);\n    const out={...row,tf15:s15,tf1h:s1,tf4h:s4,...q,plan,exec};out.risk=riskLabel(out);return out;\n  };\n  rankValue=function(x){\n    const act={\'BUY NOW\':5,\'WAIT PULLBACK\':4,\'WAIT BREAKOUT\':3,\'WAIT RECLAIM\':3,\'WAIT COOL-OFF\':2,\'NO CHASE\':1,\'WAIT\':1,\'WAIT RISK-OFF\':1,\'EXIT\':0}[x.exec?.action]||0;\n    return act*1000+x.score+(Math.log10(Math.max(x.quoteVolume,1))*2);\n  };\n  filteredRows=function(){\n    const f=$(\'sigFilter\').value;if(f===\'ALL\')return rowsCache;\n    if(f===\'BUYNOW\')return rowsCache.filter(x=>x.exec?.action===\'BUY NOW\');\n    if(f===\'WAIT\')return rowsCache.filter(x=>x.exec?.action!==\'BUY NOW\'&&x.exec?.action!==\'EXIT\');\n    if(f===\'EXIT\')return rowsCache.filter(x=>x.exec?.action===\'EXIT\');\n    return rowsCache;\n  };\n  renderRows=function(){\n    const rows=filteredRows();\n    $(\'rows\').innerHTML=rows.length?rows.map(x=>`<tr data-s="${x.symbol}"><td class="pair">${x.symbol.replace(\'USDT\',\'/USDT\')}</td><td>${pill(x.exec.cls,x.exec.action)}</td><td>${pill(x.signal,x.signal===\'STRONGBUY\'?\'STRONG\':x.signal)}</td><td class="score">${x.score}</td><td class="${x.risk.cls}">${x.risk.label}</td><td>${money(x.price)}</td><td style="color:${x.change24h>=0?\'var(--green)\':\'var(--red)\'}">${pct(x.change24h)}</td><td>${shortVol(x.quoteVolume)}</td><td>${fmt(x.tf15.rsi,1)}</td><td>${pill(x.tf1h.trend)}</td><td>${pill(x.tf4h.trend)}</td><td>${fmt(x.tf1h.rsi,1)}</td><td>${fmt(x.tf1h.relVol,2)}×</td></tr>`).join(\'\'):`<tr><td colspan="13" class="mut">No pairs match this filter right now.</td></tr>`;\n    document.querySelectorAll(\'#rows tr[data-s]\').forEach(tr=>tr.onclick=()=>openDetail(tr.dataset.s));\n  };\n  scanMarket=async function(){\n    clearErr();$(\'dot\').className=\'dot\';$(\'status\').textContent=\'Scanning…\';$(\'bar\').style.width=\'0%\';$(\'scanMsg\').textContent=\'Loading Binance universe…\';\n    try{\n      if(!universe.length)await loadUniverse();await loadBtcContext();\n      const min=+$(\'minVol\').value,n=+$(\'scanN\').value;\n      const symbols=universe.map(baseRow).filter(x=>x.quoteVolume>=min).sort((a,b)=>b.quoteVolume-a.quoteVolume).slice(0,n).map(x=>x.symbol);\n      $(\'rows\').innerHTML=`<tr><td colspan="13" class="mut">Deep scanning ${symbols.length} liquid pairs…</td></tr>`;\n      rowsCache=await pool(symbols,5,analyze,(d,t)=>{$(\'bar\').style.width=(100*d/t)+\'%\';$(\'scanMsg\').textContent=`Analyzing ${d}/${t}`});\n      rowsCache.sort((a,b)=>rankValue(b)-rankValue(a));\n      const buyNow=rowsCache.filter(x=>x.exec?.action===\'BUY NOW\').length,waits=rowsCache.filter(x=>x.exec?.action!==\'BUY NOW\'&&x.exec?.action!==\'EXIT\').length,bull=rowsCache.filter(x=>x.tf4h.trend===\'BULL\').length;\n      $(\'scanned\').textContent=rowsCache.length;$(\'strongBuys\').textContent=buyNow;$(\'buyWatch\').textContent=waits;$(\'breadth\').textContent=(rowsCache.length?100*bull/rowsCache.length:0).toFixed(1)+\'%\';\n      renderRows();$(\'scanMsg\').textContent=\'Updated \'+new Date().toLocaleTimeString();$(\'status\').textContent=\'Binance live\';$(\'dot\').className=\'dot ok\';\n    }catch(e){showErr(e)}\n  };\n  openDetail=async function(symbol){\n    clearErr();$(\'dTitle\').textContent=symbol.replace(\'USDT\',\'/USDT\');$(\'dUpdated\').textContent=\'Loading detail…\';$(\'detail\').innerHTML=\'<div class="mut">Loading execution map…</div>\';\n    try{\n      const [k15,k1,k4,kd,fctx]=await Promise.all([klines(symbol,\'15m\',220),klines(symbol,\'1h\',240),klines(symbol,\'4h\',240),klines(symbol,\'1d\',240),futuresContext(symbol)]);\n      const base=baseRow(symbol),s15=tfStats(k15),s1=tfStats(k1),s4=tfStats(k4),sd=tfStats(kd),q=scoreSetup(base,s1,s4),\n        full={...base,tf15:s15,tf1h:s1,tf4h:s4,tf1d:sd,...q},risk=riskLabel(full),plan=makePlan(s1,q.signal),exec=executionDecision(s15,s1,s4,q,plan),size=positionSize(plan?{stop:plan.stop}:null,s1.price);\n      $(\'dSignalPill\').innerHTML=pill(exec.cls,exec.action);\n      const funding=fctx.available?100*fctx.funding:null,oi=fctx.oiChange;\n      const futuresTags=fctx.available?`${tagHtml(\'Funding \'+fmt(funding,4)+\'%\',Math.abs(funding)>0.05?\'warn\':\'\')}${tagHtml(\'OI 12h \'+pct(oi),oi>3?\'pos\':oi<-3?\'neg\':\'\')}`:tagHtml(\'Futures context unavailable\',\'warn\');\n      const planHtml=plan?`<div class="sectiontitle">Execution map</div><div class="levels">\n      <div class="lv"><small>Current action</small><b>${exec.action}</b></div><div class="lv"><small>Why</small><b style="font-size:11px">${exec.reason}</b></div>\n      <div class="lv"><small>Pullback/value zone</small><b>${money(plan.pullbackLow)} – ${money(plan.pullbackHigh)}</b></div><div class="lv"><small>Breakout trigger</small><b>${money(plan.breakout)}</b></div>\n      <div class="lv"><small>No-chase level</small><b>${money(plan.noChase)}</b></div><div class="lv"><small>Invalidation / SL</small><b>${money(plan.stop)}</b></div>\n      <div class="lv"><small>TP1 / TP2 / TP3</small><b>${money(plan.tp1)} / ${money(plan.tp2)} / ${money(plan.tp3)}</b></div><div class="lv"><small>Max example size</small><b>${size?fmt(size.qty,5)+\' \'+symbol.replace(\'USDT\',\'\'):\'—\'}</b></div></div>`:`<div class="sticky-note"><b>${exec.action}</b> — ${exec.reason}</div>`;\n      $(\'detail\').innerHTML=`<div class="hero"><div><div class="price">${money(s1.price)}</div><div style="font-size:12px;margin-top:3px;color:${base.change24h>=0?\'var(--green)\':\'var(--red)\'}">24h ${pct(base.change24h)} • Vol ${shortVol(base.quoteVolume)} USDT</div><div class="grid4"><div class="mini"><div class="k">Setup score</div><div class="v">${q.score}/100</div></div><div class="mini"><div class="k">Risk</div><div class="v ${risk.cls}">${risk.label}</div></div><div class="mini"><div class="k">BTC regime</div><div class="v">${marketRegimeText().replace(\'RISKON\',\'RISK ON\').replace(\'RISKOFF\',\'RISK OFF\')}</div></div><div class="mini"><div class="k">15m RSI</div><div class="v">${fmt(s15.rsi,1)}</div></div></div></div><div class="sigbox"><div class="small">ACTION NOW</div><div class="sig ${exec.cls}">${exec.action}</div><div class="why">${exec.reason}</div><div class="why">Setup: ${q.signal===\'STRONGBUY\'?\'STRONG BUY\':q.signal}</div></div></div><div class="sectiontitle">Why setup is ranked</div><div class="badges">${q.pos.map(x=>tagHtml(x,\'pos\')).join(\'\')}${q.neg.slice(0,5).map(x=>tagHtml(x,\'neg\')).join(\'\')}</div><div class="sectiontitle">Multi-timeframe</div><div class="tfgrid">${tfBox(\'15m\',s15)}${tfBox(\'1H\',s1)}${tfBox(\'4H\',s4)}${tfBox(\'1D\',sd)}</div><div class="sectiontitle">Derivatives context • information only</div><div class="badges">${futuresTags}</div>${planHtml}<div class="sectiontitle">1H price context</div><div class="chart"><canvas id="chart"></canvas></div><div class="sticky-note"><b>Rule:</b> Immediate entry sirf jab <b>ACTION NOW = BUY NOW</b>. WAIT / NO CHASE ka matlab trade skip. Score historical win-rate nahi.</div>`;\n      $(\'detail\').dataset.loaded=\'1\';$(\'dUpdated\').textContent=\'Updated \'+new Date().toLocaleString();requestAnimationFrame(()=>drawChart($(\'chart\'),s1.closes.slice(-150)));\n    }catch(e){showErr(e)}\n  };\n  $(\'sigFilter\').onchange=renderRows;\n  scanMarket();\n})();\n';d.body.appendChild(s);});
</script></body></html>
