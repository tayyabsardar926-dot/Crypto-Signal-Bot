<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>DualSpot Scanner</title><style>:root{--bg:#07111c;--p:#0d1926;--l:#213247;--t:#eef5fb;--m:#8fa5bb;--g:#36dc93;--b:#58b5ff;--y:#ffc45c;--r:#ff7272}*{box-sizing:border-box}body{margin:0;background:#07111c;color:var(--t);font-family:Inter,system-ui,Arial}.app{max-width:1500px;margin:auto;padding:18px}.top,.controls,.cards{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.top{justify-content:space-between}.title{font-size:24px;font-weight:900}.sub,.mut{color:var(--m)}.pill{border:1px solid var(--l);padding:8px 11px;border-radius:999px}.controls{margin:14px 0;background:var(--p);border:1px solid var(--l);padding:12px;border-radius:14px}.controls input,.controls select,.controls button{height:40px;border-radius:10px;border:1px solid var(--l);background:#091521;color:var(--t);padding:0 12px}.controls input{flex:1;min-width:220px}.controls button{background:#168b73;font-weight:800;cursor:pointer}.cards{display:grid;grid-template-columns:repeat(4,1fr);margin-bottom:14px}.card{background:var(--p);border:1px solid var(--l);border-radius:14px;padding:14px}.k{font-size:11px;color:var(--m);text-transform:uppercase}.v{font-size:24px;font-weight:900;margin-top:5px}.blue{color:var(--b)}.green{color:var(--g)}.yellow{color:var(--y)}.err{display:none;background:#2c171b;border:1px solid #71323d;color:#ffb6bf;padding:10px 12px;border-radius:12px;margin-bottom:12px}.wrap{background:var(--p);border:1px solid var(--l);border-radius:14px;overflow:auto;max-height:72vh}table{width:100%;border-collapse:collapse;min-width:1000px}th,td{padding:11px 10px;border-bottom:1px solid var(--l);text-align:left;font-size:12px;white-space:nowrap}th{position:sticky;top:0;background:#0b1723;color:#9bb2c8;z-index:2}.up{color:var(--g);font-weight:800}.down{color:var(--r);font-weight:800}.flat{color:var(--y);font-weight:800}.src{font-size:9px;border:1px solid var(--l);border-radius:999px;padding:3px 6px;margin-left:6px}.bn{color:#ffd85b}.mx{color:#8ae9d8}.low{color:#ff9c95}.mid{color:#ffd27a}.high{color:#7ff2b8}@media(max-width:800px){.cards{grid-template-columns:1fr 1fr}}</style></head><body><div class='app'><div class='top'><div><div class='title'>DualSpot Scanner</div><div class='sub'>Binance Spot + MEXC Spot • all unique USDT coins • low RSI included</div></div><div class='pill'>Auto refresh 60s <span id='time'></span></div></div><div class='controls'><input id='q' placeholder='Search coin'><select id='sort'><option value='rsi'>Low 1H RSI first</option><option value='vol'>High volume first</option><option value='name'>Coin A-Z</option></select><button id='ref'>Refresh now</button></div><div class='cards'><div class='card'><div class='k'>Unique coins</div><div class='v blue' id='count'>—</div></div><div class='card'><div class='k'>Analytics loaded</div><div class='v' id='prog'>—</div></div><div class='card'><div class='k'>1H + 1D uptrend</div><div class='v green' id='up'>—</div></div><div class='card'><div class='k'>Refresh</div><div class='v yellow'>60s</div></div></div><div id='err' class='err'></div><div class='wrap'><table><thead><tr><th>#</th><th>Coin</th><th>Price</th><th>1H RSI</th><th>30m RSI</th><th>1H Trend</th><th>1D Trend</th><th>24H Volume</th></tr></thead><tbody id='rows'><tr><td colspan='8' class='mut'>Loading Binance + MEXC…</td></tr></tbody></table></div></div><script>const $=x=>document.getElementById(x);let data=[];function p(n){n=+n;if(!Number.isFinite(n))return'—';if(n>=1000)return'$'+n.toLocaleString(undefined,{maximumFractionDigits:2});if(n>=1)return'$'+n.toLocaleString(undefined,{maximumFractionDigits:4});if(n>=.01)return'$'+n.toFixed(5);return'$'+n.toPrecision(5)}function v(n){n=+n;if(!Number.isFinite(n))return'—';if(n>=1e9)return'$'+(n/1e9).toFixed(2)+'B';if(n>=1e6)return'$'+(n/1e6).toFixed(1)+'M';if(n>=1e3)return'$'+(n/1e3).toFixed(0)+'K';return'$'+n.toFixed(0)}function rc(n){if(n==null)return'—';n=+n;return `<span class='${n<40?'low':n<60?'mid':'high'}'>${n.toFixed(1)}</span>`}function tr(x){return x==='UP'?"<span class='up'>▲ UP</span>":x==='DOWN'?"<span class='down'>▼ DOWN</span>":x==='FLAT'?"<span class='flat'>• FLAT</span>":'…'}function render(){let q=$('q').value.trim().toUpperCase(),a=data.filter(x=>!q||x.coin.includes(q)||x.symbol.includes(q));let s=$('sort').value;if(s==='rsi')a.sort((x,y)=>(x.rsi1h??999)-(y.rsi1h??999));if(s==='vol')a.sort((x,y)=>y.quoteVolume-x.quoteVolume);if(s==='name')a.sort((x,y)=>x.coin.localeCompare(y.coin));$('rows').innerHTML=a.map((x,i)=>`<tr><td>${i+1}</td><td><b>${x.coin}/USDT</b><span class='src ${x.exchange==='BINANCE'?'bn':'mx'}'>${x.exchange}</span></td><td>${p(x.price)}</td><td>${rc(x.rsi1h)}</td><td>${rc(x.rsi30m)}</td><td>${tr(x.trend1h)}</td><td>${tr(x.trend1d)}</td><td>${v(x.quoteVolume)}</td></tr>`).join('')||"<tr><td colspan='8' class='mut'>No match</td></tr>"}async function load(){try{let r=await fetch('/api/scan',{cache:'no-store'}),d=await r.json();data=d.rows||[];$('count').textContent=d.count??data.length;$('prog').textContent=(d.analyticsDone||0)+' / '+(d.analyticsTotal||data.length);$('up').textContent=data.filter(x=>x.trend1h==='UP'&&x.trend1d==='UP').length;$('time').textContent='• '+new Date().toLocaleTimeString();if(d.errors&&d.errors.length){$('err').style.display='block';$('err').textContent=d.errors.join(' | ')}else $('err').style.display='none';render()}catch(e){$('err').style.display='block';$('err').textContent='Error: '+e.message}}$('q').oninput=render;$('sort').onchange=render;$('ref').onclick=load;load();setInterval(load,60000);</script></body></html>
